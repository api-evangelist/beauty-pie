aid: beauty-pie
name: Beauty Pie
description: 'Beauty Pie is a members'' beauty club that sells premium skincare, makeup, hair and bodycare,
  fragrance and supplements direct from the world''s top labs at close to factory cost, passing the savings
  to members rather than paying traditional retail markups. Founded by Marcia Kilgour, it operates a direct-to-consumer
  online store in the UK and US. The storefront is built on Shopify and exposes a modern agent-native
  commerce surface: a published /llms.txt (agents.md) instruction file, Shopify Customer Accounts OpenID
  Connect for authentication, and a Universal Commerce Protocol (UCP) MCP endpoint that lets buyer-approved
  AI shopping agents search the catalog, build carts and complete checkout via Shop Pay. This profile
  was enriched from those public agent surfaces.'
